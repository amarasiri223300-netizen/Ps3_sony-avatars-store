<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Tekken 7 | افتارات سوني 3</title><meta name="description" content="افتارات Tekken 7 المتوفرة في متجر افتارات سوني 3."><meta name="robots" content="index, follow"><link rel="canonical" href="https://comfy-unicorn-cee75e.netlify.app/Tekken-7.html"><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:Tahoma,Arial,sans-serif;background:#080b12;color:#fff;min-height:100vh}header{background:rgba(8,11,18,.95);border-bottom:1px solid #202738}.nav{max-width:1150px;margin:auto;padding:18px 22px;display:flex;align-items:center;justify-content:space-between}.logo{font-size:24px;font-weight:900}.logo span{color:#1688ff}nav a{color:#aeb8c9;text-decoration:none;margin-right:20px}.container{max-width:1150px;margin:auto;padding:35px 22px 60px}.back{display:inline-block;color:#1688ff;text-decoration:none;margin-bottom:20px;font-weight:bold}h1{font-size:42px;margin-bottom:10px}.desc{color:#aeb8c9;margin-bottom:28px}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:18px}.card{background:#101620;border:1px solid #222d3e;border-radius:18px;overflow:hidden;transition:.25s;box-shadow:0 10px 30px #0003}.card:hover{transform:translateY(-5px);border-color:#1688ff88}.avatar{height:170px;display:grid;place-items:center;background:linear-gradient(135deg,#172238,#0d121d);overflow:hidden}.avatar img{width:112px;height:112px;object-fit:cover;border-radius:14px;display:block}.info{padding:16px}.info h3{font-size:15px;margin-bottom:8px}.price{color:#52b4ff;font-weight:900;font-size:18px}.buy{width:100%;margin-top:13px;padding:11px;border:0;border-radius:10px;background:#1a2637;color:#fff;cursor:pointer}.buy:hover{background:#1688ff}@media(max-width:1000px){.grid{grid-template-columns:repeat(4,1fr)}}@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr)}h1{font-size:32px}}</style><style id="cart-system-style">
.cart-badge{display:inline-flex;align-items:center;gap:7px;background:#1688ff;color:#fff;border:0;padding:10px 15px;border-radius:12px;cursor:pointer;font-weight:800}.cart-count{background:#fff;color:#1688ff;border-radius:99px;min-width:22px;height:22px;display:inline-grid;place-items:center;font-size:12px;padding:0 5px}
.cart-overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:9999;padding:20px}.cart-overlay.open{display:flex}.cart-box{width:min(560px,100%);max-height:85vh;overflow:auto;background:#101620;border:1px solid #2a3a52;border-radius:20px;box-shadow:0 25px 80px #0008;color:#fff;padding:22px}.cart-head{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:15px}.cart-head h2{font-size:24px}.cart-close{background:#1a2637;color:#fff;border:0;border-radius:10px;padding:9px 12px;cursor:pointer}.cart-items{display:grid;gap:10px}.cart-item{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#172238;border-radius:13px;padding:12px}.cart-item-name{font-weight:700}.cart-item-price{color:#52b4ff;font-weight:900;white-space:nowrap}.cart-remove{background:#2a3445;color:#fff;border:0;border-radius:8px;padding:7px 9px;cursor:pointer}.cart-bottom{margin-top:16px;border-top:1px solid #28364a;padding-top:15px;display:grid;gap:11px}.cart-total{display:flex;justify-content:space-between;font-size:19px;font-weight:900}.cart-actions{display:flex;gap:10px}.cart-actions button{flex:1;border:0;border-radius:10px;padding:12px;cursor:pointer;font-weight:800}.cart-clear{background:#2a3445;color:#fff}.cart-checkout{background:#1688ff;color:#fff}.cart-empty{text-align:center;color:#aeb8c9;padding:28px 10px}.cart-note{font-size:12px;color:#8f9aae;text-align:center}
</style></head><body><div class="cart-overlay" id="cartOverlay" onclick="if(event.target===this)closeCart()"><div class="cart-box"><div class="cart-head"><h2>🛒 سلة المشتريات</h2><button class="cart-close" onclick="closeCart()">إغلاق</button></div><div id="cartItems" class="cart-items"></div><div class="cart-bottom"><div class="cart-total"><span>الإجمالي</span><span id="cartTotal">0.00$</span></div><div class="cart-actions"><button class="cart-clear" onclick="clearCart()">تفريغ السلة</button><button class="cart-checkout" onclick="checkoutCart()">متابعة الطلب</button></div><div class="cart-note">السلة محفوظة تلقائياً في هذا المتصفح.</div></div></div></div><header><div class="nav"><div class="logo">افتارات <span>سوني 3</span></div><nav><a href="index.html">الرئيسية</a><a href="games.html">الألعاب</a><button id="cartButton" class="cart-badge" type="button">🛒 السلة <span id="cartCount" class="cart-count">0</span></button></nav></div></header><main class="container"><a class="back" href="games.html">← العودة للألعاب</a><h1>Tekken 7</h1><p class="desc">افتارات Tekken 7 المتوفرة في متجر افتارات سوني 3.</p><div class="grid"><article class="card" data-name="Tekken 7: Lili"><div class="avatar"><img alt="Tekken 7: Lili" src="new_avatars/crop_r4c2.jpg"></div><div class="info"><h3>Tekken 7: Lili</h3><div class="price">Free</div><button class="buy" onclick="addCart('Tekken 7: Lili')">إضافة للسلة</button></div></article></div></main><script id="cart-system-script">
(function(){
 const KEY='sony_avatar_cart_v2';
 function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return []}}
 function save(items){localStorage.setItem(KEY,JSON.stringify(items));render()}
 function priceValue(text){if(!text||/free/i.test(text))return 0; const n=parseFloat(String(text).replace(',','.').replace(/[^0-9.]/g,'')); return Number.isFinite(n)?n:0}
 window.addCart=function(name){
   let source=null, btn=document.activeElement;
   if(btn && btn.closest) source=btn.closest('.card');
   if(!source) source=[...document.querySelectorAll('.card')].find(c=>c.dataset.name===name);
   const p=source?priceValue(source.querySelector('.price')?.textContent):0;
   const items=load(); const existing=items.find(x=>x.name===name);
   if(existing) existing.qty=(existing.qty||1)+1; else items.push({name,price:p,qty:1});
   save(items); openCart();
 };
 window.removeCart=function(name){save(load().filter(x=>x.name!==name))};
 window.clearCart=function(){if(load().length && confirm('هل تريد تفريغ السلة؟')) save([])};
 window.openCart=function(){document.getElementById('cartOverlay')?.classList.add('open');render()};
 window.closeCart=function(){document.getElementById('cartOverlay')?.classList.remove('open')};
 window.checkoutCart=function(){const items=load(); if(!items.length){alert('السلة فارغة.');return} alert('السلة جاهزة للطلب 🛒\nالإجمالي: '+total(items).toFixed(2)+'$\n\nيمكنك لاحقاً ربط زر الطلب ببوابة دفع أو واتساب.');};
 function total(items){return items.reduce((s,x)=>s+(x.price||0)*(x.qty||1),0)}
 function render(){
   const wrap=document.getElementById('cartItems'), totalEl=document.getElementById('cartTotal'), badge=document.getElementById('cartCount'); if(!wrap)return;
   const items=load();
   wrap.innerHTML=items.length?items.map(x=>`<div class="cart-item"><div><div class="cart-item-name">${escapeHtml(x.name)} ${x.qty>1?`× ${x.qty}`:''}</div><div class="cart-item-price">${x.price?((x.price*(x.qty||1)).toFixed(2)+'$'):'Free'}</div></div><button class="cart-remove" onclick="removeCart(${JSON.stringify(x.name)})">حذف</button></div>`).join(''):'<div class="cart-empty">السلة فارغة حالياً.</div>';
   if(totalEl) totalEl.textContent=total(items).toFixed(2)+'$';
   if(badge) badge.textContent=items.reduce((s,x)=>s+(x.qty||1),0);
 }
 function escapeHtml(s){return String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
 document.addEventListener('DOMContentLoaded',()=>{render(); const b=document.getElementById('cartButton'); if(b)b.addEventListener('click',openCart);});
})();
</script></body></html>
